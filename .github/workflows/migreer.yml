# Voert openstaande migraties uit db/migrations/ uit op Supabase (component ingest, stap B).
# Alleen met de hand te starten: Actions-tab of `gh workflow run migreer.yml`.
# Met "droog" aan toont hij alleen wat zou draaien; standaard staat droog uit (24 oktober 2026).
# Na een echte run volgen de rechtencontroles (component rechten): in de database, en van buitenaf
# via de Data API met de publieke anon-sleutel (GitHub-variabelen SUPABASE_URL en SUPABASE_ANON_KEY).
name: Migreer

on:
  workflow_dispatch:
    inputs:
      droog:
        description: "Alleen tonen wat zou draaien"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migreer:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Python opzetten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Afhankelijkheden installeren
        run: pip install -r pipeline/requirements.txt

      - name: Migraties uitvoeren
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.droog }}" = "true" ]; then
            python pipeline/migreer.py --droog
          else
            python pipeline/migreer.py
          fi

      - name: Rechtencontrole in de database
        if: ${{ !inputs.droog }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/controleer_rechten.py

      - name: Rechtentest via de API (als bezoeker)
        if: ${{ !inputs.droog }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: python pipeline/rechtentest_api.py
